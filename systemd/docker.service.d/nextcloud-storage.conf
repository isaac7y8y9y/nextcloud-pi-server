# Docker owns Compose restart policies, so it—not only the Compose launcher—
# must wait for the external storage mount after every boot.
[Unit]
RequiresMountsFor=@NEXTCLOUD_STORAGE_MOUNT@

[Service]
# Reinstall a held ingress freeze before Docker can restart published ports.
ExecStartPre=/usr/local/libexec/nextcloud-pi-ops upgrade-freeze-boot-guard
