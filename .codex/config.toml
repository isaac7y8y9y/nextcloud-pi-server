[agents.code_review]
description = "Read-only engineering reviewer that applies this repository's canonical code-review standard."
config_file = "./agents/code-review.toml"

[agents.review_my_pr]
description = "Read-only PR reviewer that checks implementation-plan conformance and applies the canonical engineering review standard."
config_file = "./agents/review-my-pr.toml"

[agents.plan_review]
description = "Read-only quality gate that evaluates an implementation plan against its ticket and this repository before implementation."
config_file = "./agents/plan-review.toml"
