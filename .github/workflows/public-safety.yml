name: Public safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Strict public-safety scan
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out complete reachable history for Gitleaks
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Run renderer and scanner tests
        run: |
          bash -n scripts/*.sh scripts/lib/*.sh
          bash scripts/test-deployment-config.sh
          bash scripts/test-compose-env-references.sh
          bash scripts/test-image-lock.sh
          bash scripts/test-active-images.sh
          bash scripts/test-compose-launcher.sh
          bash scripts/test-atomic-transaction.sh
          bash scripts/test-image-import.sh
          bash scripts/test-image-import-transaction.sh
          bash scripts/test-image-recovery-attestation.sh
          bash scripts/test-runtime-recovery-regression.sh
          bash scripts/test-deploy-config.sh
          bash scripts/test-health-check.sh
          bash scripts/test-preflight.sh
          python3 scripts/test-public-safety.py
          # The strict history gate is enabled only after the coordinated
          # git-filter-repo rewrite. Until then, enforce the proposed tree.
          python3 scripts/check-public-safety.py

      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan complete reachable history with Gitleaks
        run: "$(go env GOPATH)/bin/gitleaks git --redact --log-opts=--all"
