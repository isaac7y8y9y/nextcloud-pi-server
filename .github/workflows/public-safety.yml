name: Public safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Strict public-safety scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out complete reachable history for Gitleaks
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install repository test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep

      - name: Run pull-request repository tests
        run: bash scripts/run-tests.sh pr

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan complete reachable history with Gitleaks
        run: "$(go env GOPATH)/bin/gitleaks git --redact --log-opts=--all"
